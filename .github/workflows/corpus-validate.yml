name: corpus-validate

on:
  push:
    paths:
      - "corpus/**"
      - "scripts/extract_corpus.py"
      - "scripts/requirements-corpus.txt"
      - "apps/api/src/oracle/corpus.ts"
      - "apps/api/src/oracle/validateCorpusCli.ts"
      - ".github/workflows/corpus-validate.yml"
  pull_request:
    paths:
      - "corpus/**"
      - "scripts/extract_corpus.py"
      - "scripts/requirements-corpus.txt"
      - "apps/api/src/oracle/corpus.ts"
      - "apps/api/src/oracle/validateCorpusCli.ts"
      - ".github/workflows/corpus-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run validate:corpus
