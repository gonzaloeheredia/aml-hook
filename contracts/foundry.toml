[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [
  { access = "read-write", path = "./" },
  { access = "read-write", path = "./deployments" },
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
