[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
fs_permissions = [
  { access = "read-write", path = "./" },
  { access = "read-write", path = "./deployments" },
]

# `forge test` inherits default (no IR — less RAM). Deploy/build for production:
#   FOUNDRY_PROFILE=deploy forge script ...
[profile.test]
via_ir = false
optimizer_runs = 200

[profile.deploy]
via_ir = true
optimizer_runs = 200

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
